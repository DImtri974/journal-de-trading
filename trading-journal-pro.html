    <style>
        * { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
        body { background: #060911; color: #F8FAFC; }
        .card { background: #0F1623; border: 1px solid #1E293B; border-radius: 8px; }
        .btn-gold { background: linear-gradient(135deg, #F3D37A 0%, #D4AF37 100%); color: #0F1623; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-gold:hover { opacity: 0.9; }
        .btn-green { background: #2ECC71; color: #0F1623; }
        .btn-red { background: #EF4444; color: white; }
        .tag-gold { border: 1px solid #E5C158; background: rgba(229, 193, 88, 0.12); color: #F3D37A; }
        .tag-gold.active { background: #E5C158; color: #0F1623; }
        .modal-overlay { background: rgba(6, 9, 17, 0.95); backdrop-filter: blur(8px); position: fixed; inset: 0; z-index: 50; }
        .window-header { background: #0F1623; border-bottom: 1px solid #1E293B; padding: 12px 16px; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 8px; }
        .window-dot { width: 12px; height: 12px; border-radius: 50%; }
        .window-title { flex: 1; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #94A3B8; }
        .cal-day { aspect-ratio: 1; border: 1px solid #1E293B; border-radius: 4px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: all 0.2s; }
        .cal-day:hover { border-color: #475569; }
        .cal-day.positive { background: rgba(34, 197, 94, 0.25); border-color: #22C55E; }
        .cal-day.negative { background: rgba(239, 68, 68, 0.22); border-color: #EF4444; }
        .cal-day.neutral { background: rgba(59, 130, 246, 0.15); border-color: #3B82F6; }
        .progress-bar { height: 8px; background: #1E293B; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.3s; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: rgba(34, 197, 94, 0.95); border: 1px solid #22C55E; padding: 16px 24px; border-radius: 8px; display: flex; align-items: center; gap: 12px; animation: slideIn 0.3s ease-out; z-index: 1000; }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        input, select, textarea { background: #0B101B; border: 1px solid #1E293B; color: #F8FAFC; border-radius: 6px; padding: 10px 14px; width: 100%; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #3B82F6; }
        input[type="checkbox"] { width: auto; }
        .section-title { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #64748B; margin-bottom: 12px; }
        .nav-tab { padding: 12px 24px; cursor: pointer; border-bottom: 2px solid transparent; color: #64748B; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s; }
        .nav-tab:hover { color: #F8FAFC; }
        .nav-tab.active { color: #E5C158; border-bottom-color: #E5C158; }
        .auto-badge { background: rgba(229, 193, 88, 0.2); border: 1px solid #E5C158; color: #F3D37A; padding: 8px 16px; border-radius: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #64748B; border-bottom: 1px solid #1E293B; }
        td { padding: 12px; font-size: 13px; border-bottom: 1px solid #1E293B; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        .settings-tab { padding: 12px 24px; cursor: pointer; border-bottom: 2px solid #1E293B; color: #64748B; font-weight: 600; font-size: 12px; transition: all 0.2s; }
        .settings-tab:hover { color: #F8FAFC; }
        .settings-tab.active { color: #E5C158; border-bottom-color: #E5C158; background: rgba(229, 193, 88, 0.05); }
        .filter-btn { padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; border: 1px solid #1E293B; cursor: pointer; transition: all 0.2s; }
        .filter-btn:hover { border-color: #475569; }
        .filter-btn.active { background: #E5C158; color: #0F1623; border-color: #E5C158; }
        .stat-card { background: #0B101B; border: 1px solid #1E293B; border-radius: 6px; padding: 16px; }
    </style>
</head>

        const { useState, useEffect, useMemo, useRef } = React;

        const DEMO_TRADES = [
            { id: 1, date: '2026-10-01T09:15:00', asset: 'XAUUSD', direction: 'buy', outcome: 'tp', pnl: 500, risk: 250, strategy: 'ts', methodology: 'fvg-directe', fvgHtf: 'h4', confirmation: 'pinbar', utConfirmation: 'm15', trendHtf: 'haussiere', emotion: 'stable', killzone: 'londres', notes: '', planRespected: true, setupQuality: 'A+', disciplineScore: 100, managementType: 'tp-direct', errorTag: 'none' },

            { id: 7, date: '2026-10-09T13:15:00', asset: 'US30', direction: 'buy', outcome: 'tp', pnl: 700, risk: 250, strategy: 'ts', methodology: 'fvg-directe', fvgHtf: 'h4', confirmation: 'pinbar', utConfirmation: 'm15', trendHtf: 'haussiere', emotion: 'stable', killzone: 'new-york', notes: '', planRespected: true, setupQuality: 'A', disciplineScore: 95, managementType: 'tp-direct', errorTag: 'none' },
            { id: 8, date: '2026-10-10T10:30:00', asset: 'XAUUSD', direction: 'buy', outcome: 'tp', pnl: 900, risk: 300, strategy: 'ts', methodology: 'fvg-directe', fvgHtf: 'h4', confirmation: 'pinbar', utConfirmation: 'm15', trendHtf: 'haussiere', emotion: 'confiant', killzone: 'londres', notes: '', planRespected: true, setupQuality: 'A+', disciplineScore: 100, managementType: 'tp-direct', errorTag: 'none' },
            { id: 9, date: '2026-10-14T09:00:00', asset: 'EURUSD', direction: 'sell', outcome: 'sl', pnl: -400, risk: 400, strategy: 'ts', methodology: 'fvg-affinee', fvgHtf: 'h1', confirmation: 'englobante', utConfirmation: 'm5', trendHtf: 'baissiere', emotion: 'fomo', killzone: 'londres', notes: '', planRespected: false, setupQuality: 'Hors-Plan', disciplineScore: 40, managementType: 'sl-direct', errorTag: 'overtrading' },
            { id: 10, date: '2026-10-15T14:00:00', asset: 'NAS100', direction: 'buy', outcome: 'break-even', pnl: 0, risk: 200, strategy: 'ts', methodology: 'fvg-directe', fvgHtf: 'h4', confirmation: 'pinbar', utConfirmation: 'm15', trendHtf: 'haussiere', emotion: 'stable', killzone: 'new-york', notes: '', planRespected: true, setupQuality: 'A', disciplineScore: 85, managementType: 'be-plus1r', errorTag: 'none' },
            { id: 11, date: '2026-10-16T10:15:00', asset: 'XAUUSD', direction: 'buy', outcome: 'tp', pnl: 1000, risk: 350, strategy: 'ts', methodology: 'fvg-directe', fvgHtf: 'h4', confirmation: 'pinbar', utConfirmation: 'm15', trendHtf: 'haussiere', emotion: 'confiant', killzone: 'londres', notes: '', planRespected: true, setupQuality: 'A+', disciplineScore: 100, managementType: 'tp-direct', errorTag: 'none' },
            { id: 12, date: '2026-10-17T11:45:00', asset: 'GBPUSD', direction: 'sell', outcome: 'tp', pnl: 450, risk: 200, strategy: 'ts', methodology: 'fvg-affinee', fvgHtf: 'h1', confirmation: 'englobante', utConfirmation: 'm5', trendHtf: 'baissiere', emotion: 'stable', killzone: 'londres', notes: '', planRespected: true, setupQuality: 'A', disciplineScore: 90, managementType: 'tp-direct', errorTag: 'none' },
            { id: 13, date: '2026-10-21T09:30:00', asset: 'XAUUSD', direction: 'buy', outcome: 'sl', pnl: -600, risk: 600, strategy: 'ts', methodology: 'fvg-directe', fvgHtf: 'h4', confirmation: 'pinbar', utConfirmation: 'm15', trendHtf: 'haussiere', emotion: 'stresse', killzone: 'londres', notes: '', planRespected: false, setupQuality: 'B', disciplineScore: 65, managementType: 'sl-direct', errorTag: 'fvg-mitige' },
            { id: 14, date: '2026-10-22T10:00:00', asset: 'NAS100', direction: 'buy', outcome: 'tp', pnl: 850, risk: 300, strategy: 'ts', methodology: 'fvg-directe', fvgHtf: 'h4', confirmation: 'pinbar', utConfirmation: 'm15', trendHtf: 'haussiere', emotion: 'confiant', killzone: 'londres', notes: '', planRespected: true, setupQuality: 'A+', disciplineScore: 100, managementType: 'tp-direct', errorTag: 'none' },
            { id: 15, date: '2026-10-23T13:30:00', asset: 'US30', direction: 'buy', outcome: 'sl', pnl: -450, risk: 450, strategy: 'ts', methodology: 'fvg-affinee', fvgHtf: 'h4', confirmation: 'englobante', utConfirmation: 'm15', trendHtf: 'haussiere', emotion: 'frustre', killzone: 'new-york', notes: '', planRespected: false, setupQuality: 'Hors-Plan', disciplineScore: 50, managementType: 'sl-direct', errorTag: 'sl-trop-serre' },
            { id: 16, date: '2026-10-24T10:45:00', asset: 'XAUUSD', direction: 'buy', outcome: 'tp', pnl: 800, risk: 300, strategy: 'ts', methodology: 'fvg-directe', fvgHtf: 'h4', confirmation: 'pinbar', utConfirmation: 'm15', trendHtf: 'haussiere', emotion: 'stable', killzone: 'londres', notes: '', planRespected: true, setupQuality: 'A+', disciplineScore: 100, managementType: 'tp-direct', errorTag: 'none' }
        ];

        function TradingJournal() {
            const [trades, setTrades] = useState([]);
            const [currentView, setCurrentView] = useState('dashboard');
            const [showTradeModal, setShowTradeModal] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [showDayDetailModal, setShowDayDetailModal] = useState(false);
            const [selectedDayTrades, setSelectedDayTrades] = useState([]);
            const [settingsTab, setSettingsTab] = useState('account');
            const [showToast, setShowToast] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            const [selectedMonth, setSelectedMonth] = useState('2026-11');
            const [editingTrade, setEditingTrade] = useState(null);

            const [settings, setSettings] = useState({
                challengeName: 'Mon Journal de Trading',
                subtitle: 'Prop Firm - Phase 1',
                startingCapital: 100000,
                currency: '€',
                targetPercent: 8,
                maxDailyLossPercent: 5,
                maxDrawdownPercent: 10,
                maxTradesPerDay: 3,
                maxRiskPerTrade: 1,
                propFirm: 'ClickFunded',
                customAssets: ['EURUSD', 'GBPUSD', 'XAUUSD', 'NAS100', 'GER40', 'US30'],
                customMethodologies: ['FVG entrée directe', 'FVG entrée affinée', 'PH / PB (chasse)'],
                customSignals: ['Pinbar', 'Englobante', 'AR Entry']
            });

            const [filters, setFilters] = useState({
                asset: 'all',
                direction: 'all',
                setup: 'all',
                signal: 'all',
                killzone: 'all',
                emotion: 'all',
                planRespected: 'all'
            });

            const [formData, setFormData] = useState({
                date: '',
                asset: '',
                direction: 'buy',
                outcome: 'tp',
                pnl: '',
                risk: '',
                strategy: 'ts',
                methodology: '',
                fvgHtf: '',
                confirmation: '',
                utConfirmation: '',
                trendHtf: '',
                emotion: '',
                killzone: '',
                notes: '',
                planRespected: true,
                setupQuality: 'A',
                disciplineScore: 100,
                managementType: 'tp-direct',
                errorTag: 'none',
                checklist: {
                    fvgClean: false,
                    signalConfirmed: false,
                    riskCompliant: false,
                    noNews: false
                }
            });

            const chartRef = useRef(null);
            const chartInstanceRef = useRef(null);

            useEffect(() => {
                const saved = localStorage.getItem('tradingJournalProData');
                const savedSettings = localStorage.getItem('tradingJournalProSettings');

                if (saved) {
                    setTrades(JSON.parse(saved));
                }

                if (savedSettings) {
                    setSettings(JSON.parse(savedSettings));
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('tradingJournalProData', JSON.stringify(trades));
            }, [trades]);

            useEffect(() => {
                localStorage.setItem('tradingJournalProSettings', JSON.stringify(settings));
            }, [settings]);

            useEffect(() => {
                if (formData.fvgHtf === 'h4') {
                    setFormData(prev => ({ ...prev, utConfirmation: 'm15' }));
                } else if (formData.fvgHtf === 'h1') {
                    setFormData(prev => ({ ...prev, utConfirmation: 'm5' }));
                } else if (formData.fvgHtf === 'daily') {
                    setFormData(prev => ({ ...prev, utConfirmation: 'h1' }));
                }
            }, [formData.fvgHtf]);

            useEffect(() => {
                if (formData.outcome === 'sl' && formData.risk) {
                    setFormData(prev => ({ ...prev, pnl: -Math.abs(parseFloat(prev.risk)) }));
                } else if (formData.outcome === 'break-even') {
                    setFormData(prev => ({ ...prev, pnl: 0 }));
                }
            }, [formData.outcome, formData.risk]);

            useEffect(() => {
                const checklistValues = Object.values(formData.checklist);
                const checkedCount = checklistValues.filter(v => v).length;
                const score = (checkedCount / checklistValues.length) * 100;
                setFormData(prev => ({ ...prev, disciplineScore: score }));
            }, [formData.checklist]);

            const filteredTrades = useMemo(() => {
                return trades.filter(t => {
                    if (filters.asset !== 'all' && t.asset !== filters.asset) return false;
                    if (filters.direction !== 'all' && t.direction !== filters.direction) return false;
                    if (filters.setup !== 'all') {
                        const tradeSetup = `${t.fvgHtf}-${t.utConfirmation}`;
                        if (tradeSetup !== filters.setup) return false;
                    }
                    if (filters.signal !== 'all' && t.confirmation !== filters.signal) return false;
                    if (filters.killzone !== 'all' && t.killzone !== filters.killzone) return false;
                    if (filters.emotion !== 'all' && t.emotion !== filters.emotion) return false;
                    if (filters.planRespected === 'yes' && !t.planRespected) return false;
                    if (filters.planRespected === 'no' && t.planRespected) return false;
                    return true;
                });
            }, [trades, filters]);

            const stats = useMemo(() => {
                const tradesToAnalyze = filteredTrades;
                const total = tradesToAnalyze.length;
                const wins = tradesToAnalyze.filter(t => t.pnl > 0).length;
                const losses = tradesToAnalyze.filter(t => t.pnl < 0).length;
                const breakEven = tradesToAnalyze.filter(t => t.pnl === 0).length;

                const totalPnl = tradesToAnalyze.reduce((sum, t) => sum + t.pnl, 0);
                const totalR = tradesToAnalyze.reduce((sum, t) => sum + (t.risk ? t.pnl / t.risk : 0), 0);
                const avgR = total > 0 ? totalR / total : 0;

                const winRate = (wins + losses) > 0 ? (wins / (wins + losses)) * 100 : 0;

                const totalGains = tradesToAnalyze.filter(t => t.pnl > 0).reduce((sum, t) => sum + t.pnl, 0);
                const totalLosses = Math.abs(tradesToAnalyze.filter(t => t.pnl < 0).reduce((sum, t) => sum + t.pnl, 0));
                const avgGain = wins > 0 ? totalGains / wins : 0;
                const avgLoss = losses > 0 ? totalLosses / losses : 0;
                const profitFactor = totalLosses > 0 ? totalGains / totalLosses : totalGains > 0 ? 999 : 0;

                const balance = settings.startingCapital + trades.reduce((sum, t) => sum + t.pnl, 0);
                const pnlPercent = (totalPnl / settings.startingCapital) * 100;

                const indisciplineCost = trades.filter(t => !t.planRespected).reduce((sum, t) => sum + (t.pnl < 0 ? Math.abs(t.pnl) : 0), 0);
                const indisciplineCostR = trades.filter(t => !t.planRespected).reduce((sum, t) => sum + (t.risk && t.pnl < 0 ? Math.abs(t.pnl / t.risk) : 0), 0);

                return {
                    balance,
                    totalPnl,
                    pnlPercent,
                    winRate,
                    wins,
                    losses,
                    breakEven,
                    totalR,
                    avgR,
                    profitFactor,
                    avgGain,
                    avgLoss,
                    total,
                    indisciplineCost,
                    indisciplineCostR
                };
            }, [filteredTrades, trades, settings.startingCapital]);

            const monthTrades = useMemo(() => {
                return trades.filter(t => t.date.startsWith(selectedMonth));
            }, [trades, selectedMonth]);

            const monthStats = useMemo(() => {
                const total = monthTrades.length;
                const totalPnl = monthTrades.reduce((sum, t) => sum + t.pnl, 0);
                const pnlPercent = (totalPnl / settings.startingCapital) * 100;
                const greenDays = new Set(monthTrades.filter(t => t.pnl > 0).map(t => t.date.split('T')[0])).size;

                return { totalPnl, pnlPercent, total, greenDays };
            }, [monthTrades, settings.startingCapital]);

            const calendarData = useMemo(() => {
                const [year, month] = selectedMonth.split('-');
                const firstDay = new Date(year, month - 1, 1);
                const lastDay = new Date(year, month, 0);
                const daysInMonth = lastDay.getDate();
                const startDayOfWeek = firstDay.getDay();

                const days = [];
                const dayPnl = {};
                const dayTrades = {};

                monthTrades.forEach(trade => {
                    const day = trade.date.split('T')[0];
                    dayPnl[day] = (dayPnl[day] || 0) + trade.pnl;
                    if (!dayTrades[day]) dayTrades[day] = [];
                    dayTrades[day].push(trade);
                });

                for (let i = 0; i < (startDayOfWeek === 0 ? 6 : startDayOfWeek - 1); i++) {
                    days.push(null);
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = `${year}-${month}-${String(day).padStart(2, '0')}`;
                    days.push({
                        day,
                        date: dateStr,
                        pnl: dayPnl[dateStr] || null,
                        trades: dayTrades[dateStr] || []
                    });
                }

                const weeks = [];
                for (let i = 0; i < days.length; i += 7) {
                    const week = days.slice(i, i + 7);
                    const weekPnl = week.reduce((sum, d) => sum + (d?.pnl || 0), 0);
                    weeks.push({ days: week, total: weekPnl });
                }

                return weeks;
            }, [monthTrades, selectedMonth]);

            const todayTrades = useMemo(() => {
                const today = new Date().toISOString().split('T')[0];
                return trades.filter(t => t.date.startsWith(today));
            }, [trades]);

            const todayPnl = todayTrades.reduce((sum, t) => sum + t.pnl, 0);
            const todayPnlPercent = (todayPnl / settings.startingCapital) * 100;

            const maxDrawdown = useMemo(() => {
                let peak = settings.startingCapital;
                let maxDD = 0;
                let cumulative = settings.startingCapital;

                trades.sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(t => {
                    cumulative += t.pnl;
                    if (cumulative > peak) peak = cumulative;
                    const dd = ((peak - cumulative) / peak) * 100;
                    if (dd > maxDD) maxDD = dd;
                });

                return maxDD;
            }, [trades, settings.startingCapital]);

            const handleDayClick = (day) => {
                if (day && day.trades.length > 0) {
                    setSelectedDayTrades(day.trades);
                    setShowDayDetailModal(true);
                }
            };

            const handleAddTrade = () => {
                if (editingTrade) {
                    setTrades(trades.map(t => t.id === editingTrade.id ? { ...formData, id: editingTrade.id, pnl: parseFloat(formData.pnl), risk: parseFloat(formData.risk) } : t));
                    setToastMessage('✓ Trade modifié avec succès');
                } else {
                    const newTrade = {
                        id: Date.now(),
                        ...formData,
                        pnl: parseFloat(formData.pnl),
                        risk: parseFloat(formData.risk)
                    };
                    setTrades([...trades, newTrade]);

                    const r = formData.risk ? (formData.pnl / formData.risk).toFixed(2) : '0.00';
                    setToastMessage(`✓ Trade enregistré • ${r >= 0 ? '+' : ''}${r} R`);
                }

                setShowToast(true);
                setTimeout(() => setShowToast(false), 3000);

                setShowTradeModal(false);
                setEditingTrade(null);
                resetForm();
            };

            const handleEditTrade = (trade) => {
                setEditingTrade(trade);
                setFormData(trade);
                setShowTradeModal(true);
            };

            const handleDeleteTrade = (tradeId) => {
                if (confirm('Supprimer ce trade ?')) {
                    setTrades(trades.filter(t => t.id !== tradeId));
                    setToastMessage('✓ Trade supprimé');
                    setShowToast(true);
                    setTimeout(() => setShowToast(false), 3000);
                }
            };

            const resetForm = () => {
                setFormData({
                    date: '',
                    asset: '',
                    direction: 'buy',
                    outcome: 'tp',
                    pnl: '',
                    risk: '',
                    strategy: 'ts',
                    methodology: '',
                    fvgHtf: '',

                    {showSettingsModal && (
                        <div className="modal-overlay flex items-center justify-center p-4" onClick={() => setShowSettingsModal(false)}>
                            <div className="w-full max-w-3xl max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                                <div className="window-header">
                                    <span className="window-dot" style={{background: '#FF5F56'}}></span>
                                    <span className="window-dot" style={{background: '#FFBD2E'}}></span>
                                    <span className="window-dot" style={{background: '#27C93F'}}></span>
                                    <span className="window-title">MODIFIER LE COMPTE & MES PARAMÈTRES</span>
                                    <button onClick={() => setShowSettingsModal(false)} className="text-gray-500 hover:text-white">✕</button>
                                </div>

                                <div className="card" style={{borderRadius: '0 0 8px 8px', borderTop: 'none'}}>
                                    <div className="flex border-b border-gray-800">
                                        <div className={`settings-tab ${settingsTab === 'account' ? 'active' : ''}`} onClick={() => setSettingsTab('account')}>Compte & Prop Firm</div>
                                        <div className={`settings-tab ${settingsTab === 'rules' ? 'active' : ''}`} onClick={() => setSettingsTab('rules')}>Mes Règles de Gestion</div>
                                        <div className={`settings-tab ${settingsTab === 'custom' ? 'active' : ''}`} onClick={() => setSettingsTab('custom')}>Actifs & Setups</div>
                                        <div className={`settings-tab ${settingsTab === 'data' ? 'active' : ''}`} onClick={() => setSettingsTab('data')}>Données</div>
                                    </div>

                                    <div className="p-6 space-y-6">
                                        {settingsTab === 'account' && (
                                            <>
                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-400 mb-2">NOM DU JOURNAL / CHALLENGE</label>
                                                    <input type="text" value={settings.challengeName} onChange={(e) => setSettings({...settings, challengeName: e.target.value})} />
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-400 mb-2">SOUS-TITRE</label>
                                                    <input type="text" value={settings.subtitle} onChange={(e) => setSettings({...settings, subtitle: e.target.value})} />
                                                </div>

                                                <div className="grid grid-cols-3 gap-4">
                                                    <div>
                                                        <label className="block text-xs font-semibold text-gray-400 mb-2">CAPITAL DE DÉPART</label>
                                                        <input type="number" value={settings.startingCapital} onChange={(e) => setSettings({...settings, startingCapital: parseFloat(e.target.value)})} />
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-semibold text-gray-400 mb-2">DEVISE</label>
                                                        <select value={settings.currency} onChange={(e) => setSettings({...settings, currency: e.target.value})}>
                                                            <option value="€">€ (Euro)</option>
                                                            <option value="$">$ (Dollar)</option>
                                                        </select>
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-semibold text-gray-400 mb-2">PROP FIRM</label>
                                                        <input type="text" value={settings.propFirm} onChange={(e) => setSettings({...settings, propFirm: e.target.value})} />
                                                    </div>
                                                </div>
                                            </>
                                        )}

                                        {settingsTab === 'rules' && (
                                            <>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-xs font-semibold text-gray-400 mb-2">OBJECTIF DU MOIS / CHALLENGE (%)</label>
                                                        <input type="number" step="0.1" value={settings.targetPercent} onChange={(e) => setSettings({...settings, targetPercent: parseFloat(e.target.value)})} />
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-semibold text-gray-400 mb-2">PERTE MAX JOURNALIÈRE (%)</label>
                                                        <input type="number" step="0.1" value={settings.maxDailyLossPercent} onChange={(e) => setSettings({...settings, maxDailyLossPercent: parseFloat(e.target.value)})} />
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-3 gap-4">
                                                    <div>
                                                        <label className="block text-xs font-semibold text-gray-400 mb-2">MAX DRAWDOWN (%)</label>
                                                        <input type="number" step="0.1" value={settings.maxDrawdownPercent} onChange={(e) => setSettings({...settings, maxDrawdownPercent: parseFloat(e.target.value)})} />
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-semibold text-gray-400 mb-2">TRADES MAX / JOUR</label>
                                                        <input type="number" value={settings.maxTradesPerDay} onChange={(e) => setSettings({...settings, maxTradesPerDay: parseInt(e.target.value)})} />
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-semibold text-gray-400 mb-2">RISQUE MAX / TRADE (%)</label>
                                                        <input type="number" step="0.1" value={settings.maxRiskPerTrade} onChange={(e) => setSettings({...settings, maxRiskPerTrade: parseFloat(e.target.value)})} />
                                                    </div>
                                                </div>
                                            </>
                                        )}

                                        {settingsTab === 'custom' && (
                                            <>
                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-400 mb-2">MES ACTIFS FAVORIS (séparés par des virgules)</label>
                                                    <input type="text" value={settings.customAssets.join(', ')} onChange={(e) => setSettings({...settings, customAssets: e.target.value.split(',').map(a => a.trim())})} />
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-400 mb-2">MES MÉTHODOLOGIES (séparées par des virgules)</label>
                                                    <input type="text" value={settings.customMethodologies.join(', ')} onChange={(e) => setSettings({...settings, customMethodologies: e.target.value.split(',').map(m => m.trim())})} />
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-400 mb-2">MES SIGNAUX (séparés par des virgules)</label>
                                                    <input type="text" value={settings.customSignals.join(', ')} onChange={(e) => setSettings({...settings, customSignals: e.target.value.split(',').map(s => s.trim())})} />
                                                </div>
                                            </>
                                        )}

                                        {settingsTab === 'data' && (
                                            <>
                                                <div className="text-sm text-gray-300 mb-4">Gérez vos données de trading : sauvegarde complète, restauration et données de test.</div>

                                                <div className="space-y-3">
                                                    <button onClick={exportJSON} className="w-full btn-gold py-3 rounded-lg text-sm">
                                                        💾 SAUVEGARDER (Export JSON)
                                                    </button>

                                                    <label className="w-full btn-gold py-3 rounded-lg text-sm block text-center cursor-pointer">
                                                        📂 RESTAURER (Import JSON)
                                                        <input type="file" accept=".json" onChange={importJSON} className="hidden" />
                                                    </label>

                                                    <button onClick={loadDemoData} className="w-full py-3 rounded-lg text-sm border border-gray-700 hover:bg-gray-800">
                                                        🎯 CHARGER DES DONNÉES DE TEST (16 trades)
                                                    </button>

                                                    <button onClick={clearAllData} className="w-full py-3 rounded-lg text-sm bg-red-900/30 border border-red-700 text-red-300 hover:bg-red-900/50">
                                                        🗑 RÉINITIALISER LE JOURNAL À ZÉRO
                                                    </button>
                                                </div>
                                            </>
                                        )}

                                        <div className="flex gap-3 pt-4 border-t border-gray-800">
                                            <button onClick={() => setShowSettingsModal(false)} className="flex-1 btn-gold py-3 rounded-lg text-sm">
                                                ENREGISTRER & FERMER
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Day Detail Modal */}
                    {showDayDetailModal && (
                        <div className="modal-overlay flex items-center justify-center p-4" onClick={() => setShowDayDetailModal(false)}>
                            <div className="w-full max-w-3xl" onClick={(e) => e.stopPropagation()}>
                                <div className="window-header">
                                    <span className="window-dot" style={{background: '#FF5F56'}}></span>
                                    <span className="window-dot" style={{background: '#FFBD2E'}}></span>
                                    <span className="window-dot" style={{background: '#27C93F'}}></span>
                                    <span className="window-title">TRADES DU JOUR • {selectedDayTrades[0] && new Date(selectedDayTrades[0].date).toLocaleDateString('fr-FR', {day: '2-digit', month: 'long', year: 'numeric'})}</span>
                                    <button onClick={() => setShowDayDetailModal(false)} className="text-gray-500 hover:text-white">✕</button>
                                </div>

                                <div className="card" style={{borderRadius: '0 0 8px 8px', borderTop: 'none'}}>
                                    <div className="p-6 space-y-4">
                                        {selectedDayTrades.map(t => (
                                            <div key={t.id} className="card p-4" style={{background: '#0B101B'}}>
                                                <div className="flex items-center justify-between mb-2">
                                                    <div className="flex items-center gap-3">
                                                        <span className="mono text-xs text-gray-400">{new Date(t.date).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'})}</span>
                                                        <span className="mono text-sm font-bold">{t.asset}</span>
                                                        <span className={`text-xs font-semibold ${t.direction === 'buy' ? 'text-green-400' : 'text-red-400'}`}>{t.direction === 'buy' ? 'BUY' : 'SELL'}</span>
                                                        <span className="text-xs">{t.fvgHtf?.toUpperCase()} → {t.utConfirmation?.toUpperCase()}</span>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => {handleEditTrade(t); setShowDayDetailModal(false);}} className="text-blue-400 hover:text-blue-300 text-sm">✎ Modifier</button>
                                                        <button onClick={() => {handleDeleteTrade(t.id); setShowDayDetailModal(false);}} className="text-red-400 hover:text-red-300 text-sm">🗑 Supprimer</button>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-6 text-sm">
                                                    <span className={`mono font-semibold ${t.pnl >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                        {t.pnl >= 0 ? '+' : ''}{t.pnl.toLocaleString('fr-FR', {minimumFractionDigits: 2})} {settings.currency}
                                                    </span>
                                                    <span className="mono">{t.risk ? `${(t.pnl / t.risk) >= 0 ? '+' : ''}${(t.pnl / t.risk).toFixed(2)} R` : '-'}</span>
                                                    <span className="text-gray-400">Killzone : {t.killzone || '-'}</span>
                                                    <span className="text-gray-400">Émotion : {t.emotion || '-'}</span>
                                                    <span>{t.planRespected ? <span className="text-green-400">✓ Plan OK</span> : <span className="text-red-400">✗ Hors-Plan</span>}</span>
                                                </div>
                                                {t.notes && <div className="text-xs text-gray-400 mt-2">{t.notes}</div>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showToast && (
                        <div className="toast">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 0C4.48 0 0 4.48 0 10C0 15.52 4.48 20 10 20C15.52 20 20 15.52 20 10C20 4.48 15.52 0 10 0ZM8 15L3 10L4.41 8.59L8 12.17L15.59 4.58L17 6L8 15Z" fill="currentColor"/>
                            </svg>
                            <span className="font-semibold">{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<TradingJournal />, document.getElementById('app'));
    </script>
</body>
</html>
